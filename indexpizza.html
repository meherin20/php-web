<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Party</title>
  <style>
    table { border-collapse: collapse; width: 80%; margin: 20px auto; }
    th, td { border: 1px solid #000; padding: 10px; text-align: center; }
    th { background: #eee; }
    h2 { text-align: center; }
    input { width: 90px; padding: 6px; }
    .btn { display: flex; justify-content: center; margin: 20px; }
    button { padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>

<h2>Pizza Party Input (3 Cases)</h2>

<form action="pizzaParty.php" method="POST">
  <table>
    <tr>
      <th>Number of Students</th>
      <th>Slices per Student</th>
      <th>Slices per Pizza</th>
    </tr>

    <tr>
      <td><input type="number" name="students1" required min="1"></td>
      <td><input type="number" name="sps1" required min="1"></td>
      <td><input type="number" name="spp1" required min="1"></td>
    </tr>

    <tr>
      <td><input type="number" name="students2" required min="1"></td>
      <td><input type="number" name="sps2" required min="1"></td>
      <td><input type="number" name="spp2" required min="1"></td>
    </tr>

    <tr>
      <td><input type="number" name="students3" required min="1"></td>
      <td><input type="number" name="sps3" required min="1"></td>
      <td><input type="number" name="spp3" required min="1"></td>
    </tr>
  </table>

  <div class="btn">
    <button type="submit">Calculate</button>
  </div>
</form>

</body>
</html>
